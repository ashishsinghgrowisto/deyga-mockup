  if(SORT==='rev')out.sort(function(a,b){return CAT[b].rev-CAT[a].rev;});
  if(SORT==='az')out.sort(function(a,b){return CAT[a].title.localeCompare(CAT[b].title);});
  renderGrid('plpGrid',out);
  document.getElementById('cnt').textContent=out.length+' products';
}
