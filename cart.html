<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<div id="viewport">

<div class="wrap"><div class="crumb"><a href="home.html">Home</a> / <span>Shopping Bag</span></div>
<h1 style="font-size:34px;margin-bottom:4px">Your Shopping <span style="color:var(--green)">Bag</span></h1>
<div class="cpage"><div><div class="cbox" id="cpItems"></div>
<div style="margin-top:22px"><h2 class="sec-title" style="font-size:22px;margin-bottom:14px">You may also like</h2><div class="grid" id="cpRec"></div></div></div>
<aside class="summary"><h3 style="font-size:19px;margin-bottom:14px">Order Summary</h3>
<div class="sline"><span>Subtotal</span><b id="cpSub">₹ 0</b></div>
<div class="sline"><span>Shipping</span><span id="cpShip">Calculated at checkout</span></div>
<div class="sline"><span>You save</span><span id="cpSave" style="color:var(--red);font-weight:700">₹ 0</span></div>
<div class="sline tot"><span>Total</span><b id="cpTot">₹ 0</b></div>
<div class="coup" style="margin:16px 0 12px"><input placeholder="Coupon code (try DEYGA1010)"><button onclick="applyCoupon(this)">Apply</button></div>
<button class="co" onclick="toast('Checkout is not part of this mockup')">Proceed to checkout</button>
<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:12px">Free shipping on prepaid orders above ₹999</div>
</aside></div></div>

</div>
<script src="app.js"></script>
<script>
window.COLIMG = {"skincare-bestsellers": "assets/fd80acc0adc9f8f0a28f936e63b89d67.webp", "best-sellers": "assets/ddaea0d99b2c350041c9929cd9c7edb3.webp", "hair-care-view-all": "assets/da12a089d313ed345be5ebbd3d296052.webp", "face": "assets/f5f8bf7d00426fa013144f36b5ff45e4.webp", "lip-care": "assets/2e0eb5fed74939f9b64743ba63f94bd3.webp", "combo": "assets/16783c7630f45068d59ff332f079cfc3.webp", "cosmetics": "assets/3ce4ceb0f188c0765dea6c6b3d63fcb1.webp", "eye-care": "assets/d443772d19400d9b358a658a367b52da.webp", "body-care-view-all": "assets/45114d5f3db46df3b9d6091602322575.webp", "travel-minis": "assets/9153d5055296aba3ae406b4d2f35c774.webp", "skin-serum": "assets/b33bc4cf09a58b2bf4980ec084e45fab.webp", "toner": "assets/2b8d4a50ee1dc9232f6df6d16d320e0e.webp", "face-wash": "assets/c269d36ef9e97d1d55f3563fb40574fc.webp", "face-scrub": "assets/7b4012932dedcc2bf19cc4a783c1e45c.webp", "face-packs-masks": "assets/252afad4de64f240387dd68da2eca9b4.webp", "face-cream-sunscreen": "assets/9866bb504c3492320690852baf4e5dcb.webp", "oral-care": "assets/f8a4b75eba398f6d407e9cf9dc44e234.webp", "shampoo-conditioner": "assets/a4debcdc5efb811e2a69b7340dc41a14.webp", "hair-oil": "assets/1465d259d128d6ca803f7f8ee318ab26.webp", "combs": "assets/a2318e4bc8516c0583c38f7d32ff1f12.webp", "handmade-soap": "assets/3876fe99ce18d4bc405d89d139ee80ad.webp", "body-butter": "assets/aa08ed92f9ae888179cb2558963a6894.webp", "body-lotion-sunscreen": "assets/e8fffb8a77ed8c3f0501116488f22ce4.webp", "body-wash": "assets/fa1aa43a4eb7ed448c105a656df55e19.webp", "scrub": "assets/f18188bf87cae9d6586d47850b618ebb.webp", "foot-care": "assets/1de9121ea4448be8778b95f306d0ac96.webp", "powder": "assets/d44e41828fc89c60af4252b14cf01658.webp", "deo": "assets/72bd0a56a95cbad2e4e7427c0a45ffaa.webp", "baby-care": "assets/59a31b0f745485b35b3a9d194f086a76.webp", "gifting": "assets/9ff11f0fabd198fcb44919010c64068e.webp"};
renderChrome("cart.html");

window.renderCartPage=function(){
  var box=document.getElementById('cpItems'); if(!box) return;
  if(!cart.length){box.innerHTML='<div class="empty"><b>Your bag is empty</b>Explore our best sellers to get started.<br><br><a class="atc" style="display:inline-block;max-width:220px;padding:11px 26px" href="collection-best-sellers.html">Shop best sellers</a></div>';}
  else box.innerHTML=cart.map(function(c){var p=CAT[c.h];if(!p)return '';
    return '<div class="crow"><a href="product-'+c.h+'.html"><img src="'+p.img+'" alt=""></a><div style="flex:1">'+
    '<a class="t" style="font-size:15px;font-weight:700" href="product-'+c.h+'.html">'+p.title+'</a>'+
    '<div class="v" style="font-size:12.5px;color:var(--muted);margin:4px 0 10px">'+(p.opts[c.v]||'')+'</div>'+
    '<div class="acts" style="display:flex;gap:14px;align-items:center"><span class="qty"><button onclick="chQty(\''+c.key+'\',-1)">-</button><span>'+c.q+'</span><button onclick="chQty(\''+c.key+'\',1)">+</button></span>'+
    '<button class="lnk" style="font-size:12px;text-decoration:underline;color:var(--muted)" onclick="rmItem(\''+c.key+'\')">Remove</button></div></div>'+
    '<div style="font-weight:800">'+INR(p.prices[c.v]*c.q)+'</div></div>';}).join('');
  var sub=cartTotal();
  var save=cart.reduce(function(s,c){var p=CAT[c.h];var cm=p&&p.cmps[c.v];return s+((cm&&cm>p.prices[c.v])?(cm-p.prices[c.v])*c.q:0);},0);
  document.getElementById('cpSub').textContent=INR(sub);
  document.getElementById('cpTot').textContent=INR(sub);
  document.getElementById('cpSave').textContent=INR(save);
  document.getElementById('cpShip').textContent = sub>=999 ? 'FREE' : '₹ 49';
};
renderGrid('cpRec',["beetroot-lip-balm-stick", "aloe-vera-gel", "deyga-100-plant-based-hair-color-black", "rice-water-shampoo"]);
renderCartPage();

</script>
</body></html>
